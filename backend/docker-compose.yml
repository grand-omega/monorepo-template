services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["5432:5432"]
    volumes:
      - pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI

  app:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      mailhog:  { condition: service_started }
    environment:
      APP_ENV: dev
      APP_BIND_ADDR: "0.0.0.0:8080"
      APP_METRICS_BIND_ADDR: "0.0.0.0:9090"
      APP_PUBLIC_BASE_URL: "http://localhost:8080/"
      APP_DATABASE_URL: "postgres://app:app@postgres:5432/app"
      APP_DATABASE_MAX_CONNECTIONS: "10"
      APP_REDIS_URL: "redis://redis:6379"
      APP_JWT_PRIVATE_KEY: ${APP_JWT_PRIVATE_KEY}
      APP_JWT_PUBLIC_KEY:  ${APP_JWT_PUBLIC_KEY}
      APP_JWT_KID: "dev-1"
      APP_JWT_ISSUER: "lab-rust-server"
      APP_JWT_AUDIENCE: "mobile"
      APP_ACCESS_TOKEN_TTL: "15m"
      APP_REFRESH_TOKEN_TTL: "30d"
      APP_SMTP_URL: "smtp://mailhog:1025"
      APP_SMTP_FROM: "no-reply@example.test"
      APP_SMTP_FROM_NAME: "Lab Rust Server"
      APP_ARGON2_M_COST: "19456"
      APP_ARGON2_T_COST: "2"
      APP_ARGON2_P_COST: "1"
      APP_LOGIN_MAX_FAILURES: "10"
      APP_LOGIN_LOCK_DURATION: "15m"
      APP_CORS_ALLOWED_ORIGINS: ""
      APP_TRUSTED_PROXY_CIDRS: ""
      APP_MIGRATE_ON_START: "true"
      APP_LOG_FORMAT: "pretty"
      APP_LOG: "info,sqlx=warn,tower_http=info,hyper=warn"
    ports:
      - "8080:8080"
      - "9090:9090"

volumes:
  pg18:
