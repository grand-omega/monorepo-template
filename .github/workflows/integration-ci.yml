name: Integration CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "apps/mobile/**"
      - "apps/admin/**"
      - "contracts/**"
      - "docker-compose.yml"
      - ".github/workflows/integration-ci.yml"

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Validate admin contract client generation
        working-directory: apps/admin
        run: |
          bun install --frozen-lockfile
          bun run openapi:gen
          bun run typecheck
