name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run openapi:gen
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Bundle budget — main chunk ≤ 250 KB gzipped
        run: |
          set -euo pipefail
          MAIN_GZ=$(find dist/assets -name 'index-*.js' -print0 | xargs -0 -I{} sh -c 'gzip -c "{}" | wc -c' | sort -nr | head -1)
          echo "main chunk gzipped: ${MAIN_GZ} bytes"
          if [ "${MAIN_GZ}" -gt 256000 ]; then
            echo "::error::main chunk exceeds 250 KB gzipped budget (${MAIN_GZ} bytes)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run openapi:gen
      - run: npx playwright install --with-deps chromium
      # TODO(@yanwenxu, 2026-05-31): wire up docker-compose with backend image
      # for true contract-drift coverage. Skipping for scaffolding step.
      - run: echo "E2E against real backend wired up in step 5 (auth)."

  openapi-drift:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Drift check vs deployed backend
        env:
          API_URL: ${{ vars.DEPLOYED_API_URL }}
        run: |
          if [ -z "${API_URL:-}" ]; then
            echo "::warning::DEPLOYED_API_URL repo variable not set — skipping drift check."
            echo "Set it under Settings → Secrets and variables → Actions → Variables once a staging backend is reachable."
            exit 0
          fi
          npm run openapi:drift
